---
# Linux Rust Build
# Image must be pre-built once on the Drone host (see ci/Dockerfile):
#   docker build -t lua-ci:latest -f ci/Dockerfile .
# drone-runner-docker talks to the host docker daemon;
# local images are never pulled, so keep the tag in sync manually.
kind: pipeline
type: docker
name: rust-linux

platform:
  os: linux
  arch: amd64

steps:
- name: restore-deps
  image: meltwater/drone-cache
  settings:
    backend: "filesystem"
    restore: true
    cache_key: "cargo-registry"
    mount:
      - .cargo/registry
    local_root: "/tmp/drone-cache"
- name: build
  image: lua-ci:latest
  pull: if-not-exists
  environment:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
    RUSTC_WRAPPER: /usr/local/cargo/bin/sccache
    SCCACHE_DIR: /drone/src/target/sccache
    SCCACHE_CACHE_SIZE: 2G
  commands:
  - cargo install sccache
  - cargo build --release
  - cargo test
  - ./target/release/lua -v

- name: save-deps
  image: meltwater/drone-cache
  settings:
    backend: "filesystem"
    rebuild: true
    cache_key: "cargo-registry"
    mount:
      - .cargo/registry
    local_root: "/tmp/drone-cache"

volumes:
  - name: cache
    temp: {}

---
# Windows Rust Build
# Requires cargo on the runner service PATH (exec runner runs PowerShell).
kind: pipeline
type: exec
name: rust-windows

platform:
  os: windows
  arch: amd64

steps:
- name: build
  commands:
  - cargo build --release
  - cargo test
  - .\target\release\lua.exe -v
