---
# Linux Rust Build
# Image must be pre-built once on the Drone host (see ci/Dockerfile):
#   docker build -t lua-ci:latest -f ci/Dockerfile .
# drone-runner-docker talks to the host docker daemon;
# local images are never pulled, so keep the tag in sync manually.
kind: pipeline
type: docker
name: rust-linux

platform:
  os: linux
  arch: amd64

steps:
- name: restore-cache
  pull: if-not-exists
  image: drillster/drone-volume-cache
  volumes:
  - name: cache
    path: /cache
  settings:
    restore: true
    mount:
      - .cargo
      - target
- name: build
  image: lua-ci:latest
  pull: if-not-exists
  environment:
    CARGO_HOME: /drone/src/.cargo
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
  commands:
  - cargo build --release
  - sccache --show-stats
  - cargo test
  - ./target/release/lua -v

- name: save-cache
  image: drillster/drone-volume-cache
  volumes:
  - name: cache
    path: /cache
  settings:
    rebuild: true
    mount:
      - .cargo
      - target

volumes:
- name: cache
  host:
    path: /tmp/drone-cache

---
# Windows Rust Build
# Requires cargo on the runner service PATH (exec runner runs PowerShell).
kind: pipeline
type: exec
name: rust-windows

platform:
  os: windows
  arch: amd64

steps:
- name: build
  commands:
  - cargo build --release
  - cargo test
  - .\target\release\lua.exe -v
