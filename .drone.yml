---
# Linux Rust Build
# Image must be pre-built once on the Drone host (see ci/Dockerfile):
#   docker build -t lua-ci:latest -f ci/Dockerfile .
# drone-runner-docker talks to the host docker daemon;
# local images are never pulled, so keep the tag in sync manually.
kind: pipeline
type: docker
name: rust-linux

platform:
  os: linux
  arch: amd64

steps:
- name: restore-cache
  pull: if-not-exists
  image: drillster/drone-volume-cache
  volumes:
  - name: cache
    path: /cache
  settings:
    restore: true
    mount:
      - .cargo
      - target
      - deps/cache
      - deps/src
- name: build
  image: lua-ci:latest
  pull: if-not-exists
  environment:
    CARGO_HOME: /drone/src/.cargo
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
  commands:
  - cargo build --release
  - sccache --show-stats
  - cargo test --release
  - ./target/release/lua -v

- name: cmp-tests
  image: lua-ci:latest
  pull: if-not-exists
  environment:
    CARGO_HOME: /drone/src/.cargo
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
  commands:
  # 编译器比对测试: build.rs 仅在 cmp_c feature 下编译 src/ C Lua 源码并链接
  - cargo test --features cmp_c --release -- compiler::cmp_tests::compiler_compare_tests

- name: deps-tests
  image: lua-ci:latest
  pull: if-not-exists
  environment:
    CARGO_HOME: /drone/src/.cargo
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
  commands:
  # 依赖库测试 (lua-cjson/luasocket/lsqlite3/luarocks/sol2/skynet/skynet-e2e):
  # setup.sh 重建 threaded,skynet 版 lua + 构建 C lua (e2e 客户端用)
  # + 下载/补丁/编译 C 模块与 skynet (lsqlite3/skynet 用 git clone, 需 git)
  # deps/cache + deps/src 由 restore/save-cache 步骤持久化 (归档与 git clone 不再重复联网);
  # cron 构建时清空缓存, 强制重新拉取 master 分支最新源码 (cjson/luasocket/skynet 跟踪 master)
  - if [ "$DRONE_BUILD_EVENT" = "cron" ]; then rm -rf deps/cache deps/src; fi
  - cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
  - cmake --build build --parallel "$(nproc)"
  - bash deps/setup.sh --rebuild-lua
  - bash deps/test.sh

- name: bench
  image: lua-ci:latest
  pull: if-not-exists
  environment:
    CARGO_HOME: /drone/src/.cargo
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
  commands:
  # 性能基准: C vs Rust。构建决策 (PGO + panic=abort/lua_longjmp 平台默认)
  # 全部内聚在 tools/build_release_opt.sh, 本行是无内联逻辑的单条 bash 调用 —
  # Windows exec runner 对 commands 做启动期 bash 解析且内联 VAR=x 前缀在
  # #120 实证会泄漏为 cargo 参数, 命令行保持极简 (记忆 #148/#97)。
  # C lua 由 deps-tests 的 cmake 构建提供; build_release_opt.sh 恢复默认
  # features (deps/setup.sh 在 target/release/lua 留下的 threaded,skynet
  # 变体不能用于基准)。
  - bash tools/build_release_opt.sh
  - bash tools/ci_bench.sh --skip-build full

- name: save-cache
  # 缓存写回纯属加速优化, 与构建/测试结果无关。CI #114 实证宿主 /tmp/drone-cache
  # 分区写满 (rsync code 11 "No space left on device") 会把这个步骤变红并连带
  # 整条流水线 failure — 尽管 build/cmp/deps/bench 四步全绿。失败降级为警告,
  # 下次构建 restore-cache miss 时自然回退全量重建。
  failure: ignore
  image: drillster/drone-volume-cache
  volumes:
  - name: cache
    path: /cache
  settings:
    rebuild: true
    mount:
      - .cargo
      - target
      - deps/cache
      - deps/src

volumes:
- name: cache
  host:
    path: /tmp/drone-cache

---
# Windows Rust Build
# Requires cargo on the runner service PATH (exec runner runs PowerShell).
kind: pipeline
type: exec
name: rust-windows

platform:
  os: windows
  arch: amd64

steps:
- name: build
  commands:
  - cargo build --release
  - cargo test --release
  - .\target\release\lua.exe -v

- name: bench
  commands:
  - powershell -ExecutionPolicy Bypass -File tools/ci_bench_win.ps1 -Scale full
