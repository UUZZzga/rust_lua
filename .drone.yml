---
# Linux Rust Build
# Image must be pre-built once on the Drone host (see ci/Dockerfile):
#   docker build -t lua-ci:latest -f ci/Dockerfile .
# drone-runner-docker talks to the host docker daemon;
# local images are never pulled, so keep the tag in sync manually.
kind: pipeline
type: docker
name: rust-linux

platform:
  os: linux
  arch: amd64

steps:
- name: restore-cache
  pull: if-not-exists
  image: drillster/drone-volume-cache
  volumes:
  - name: cache
    path: /cache
  settings:
    restore: true
    mount:
      - .cargo
      - target
- name: build
  image: lua-ci:latest
  pull: if-not-exists
  environment:
    CARGO_HOME: /drone/src/.cargo
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
  commands:
  - cargo build --release
  - sccache --show-stats
  - cargo test
  - ./target/release/lua -v

- name: cmp-tests
  image: lua-ci:latest
  pull: if-not-exists
  environment:
    CARGO_HOME: /drone/src/.cargo
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
  commands:
  # 编译器比对测试: build.rs 仅在 cmp_c feature 下编译 src/ C Lua 源码并链接
  - cargo test --features cmp_c -- compiler::cmp_tests::compiler_compare_tests

- name: deps-tests
  image: lua-ci:latest
  pull: if-not-exists
  environment:
    CARGO_HOME: /drone/src/.cargo
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
  commands:
  # 依赖库测试 (lua-cjson/luasocket/lsqlite3/luarocks/sol2/skynet/skynet-e2e):
  # setup.sh 重建 threaded,skynet 版 lua + 构建 C lua (e2e 客户端用)
  # + 下载/补丁/编译 C 模块与 skynet (lsqlite3/skynet 用 git clone, 需 git)
  - cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
  - cmake --build build --parallel "$(nproc)"
  - bash deps/setup.sh
  - bash deps/test.sh

- name: bench
  image: lua-ci:latest
  pull: if-not-exists
  environment:
    CARGO_HOME: /drone/src/.cargo
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
  commands:
  # 性能基准: C vs Rust (build/lua 已由 deps-tests 构建; cargo build 恢复默认 features
  # — deps/setup.sh 在 target/release/lua 留下了 threaded,skynet 变体, 不能用于基准)
  - cargo build --release
  - bash tools/ci_bench.sh --skip-build full

- name: save-cache
  image: drillster/drone-volume-cache
  volumes:
  - name: cache
    path: /cache
  settings:
    rebuild: true
    mount:
      - .cargo
      - target

volumes:
- name: cache
  host:
    path: /tmp/drone-cache

---
# Windows Rust Build
# Requires cargo on the runner service PATH (exec runner runs PowerShell).
kind: pipeline
type: exec
name: rust-windows

platform:
  os: windows
  arch: amd64

steps:
- name: build
  commands:
  - cargo build --release
  - cargo test
  - .\target\release\lua.exe -v

- name: bench
  commands:
  - $env:Path = 'D:\Program Files\CMake\bin;D:\Rust\cargo\bin;' + $env:Path; & 'C:\Program Files\Git\bin\bash.exe' --login tools/ci_bench.sh full
