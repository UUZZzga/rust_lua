# Drone CI: Linux (docker) + Windows (exec) Rust 构建与测试
# 完整测试套件 (deps / verify / gc_bench) 仍由 GitHub Actions 手动触发:
# .github/workflows/ci.yml

---
# Linux Rust Build
# image 需先在 Drone 宿主机预构建 (见 ci/Dockerfile 内注释):
#   docker build -t lua-ci:latest -f ci/Dockerfile .
# runner 使用宿主机 docker daemon, 本地镜像不会被自动 pull/构建
kind: pipeline
type: docker
name: rust-linux

platform:
  os: linux
  arch: amd64

steps:
- name: build
  image: lua-ci:latest
  pull: if-not-exists
  environment:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
  commands:
  - cargo build --release
  - cargo test
  - ./target/release/lua -v

---
# Windows Rust Build
kind: pipeline
type: exec
name: rust-windows

platform:
  os: windows
  arch: amd64

steps:
- name: build
  commands:
  - cargo build --release
  - cargo test
  - .\target\release\lua.exe -v
