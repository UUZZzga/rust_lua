---
# Linux Rust Build
# Image must be pre-built once on the Drone host (see ci/Dockerfile):
#   docker build -t lua-ci:latest -f ci/Dockerfile .
# drone-runner-docker talks to the host docker daemon;
# local images are never pulled, so keep the tag in sync manually.
kind: pipeline
type: docker
name: rust-linux

platform:
  os: linux
  arch: amd64

steps:
- name: restore-cache
  pull: if-not-exists
  image: drillster/drone-volume-cache
  volumes:
  - name: cache
    path: /cache
  settings:
    restore: true
    mount:
      - .cargo
      - target
      - deps/cache
      - deps/src
- name: build
  image: lua-ci:latest
  pull: if-not-exists
  environment:
    CARGO_HOME: /drone/src/.cargo
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
  commands:
  - cargo build --release
  - sccache --show-stats
  - cargo test --release
  - ./target/release/lua -v

- name: cmp-tests
  image: lua-ci:latest
  pull: if-not-exists
  environment:
    CARGO_HOME: /drone/src/.cargo
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
  commands:
  # 编译器比对测试: build.rs 仅在 cmp_c feature 下编译 src/ C Lua 源码并链接
  - cargo test --features cmp_c --release -- compiler::cmp_tests::compiler_compare_tests

- name: deps-tests
  image: lua-ci:latest
  pull: if-not-exists
  environment:
    CARGO_HOME: /drone/src/.cargo
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
  commands:
  # 依赖库测试 (lua-cjson/luasocket/lsqlite3/luarocks/sol2/skynet/skynet-e2e):
  # setup.sh 重建 threaded,skynet 版 lua + 构建 C lua (e2e 客户端用)
  # + 下载/补丁/编译 C 模块与 skynet (lsqlite3/skynet 用 git clone, 需 git)
  # deps/cache + deps/src 由 restore/save-cache 步骤持久化 (归档与 git clone 不再重复联网);
  # cron 构建时清空缓存, 强制重新拉取 master 分支最新源码 (cjson/luasocket/skynet 跟踪 master)
  - if [ "$DRONE_BUILD_EVENT" = "cron" ]; then rm -rf deps/cache deps/src; fi
  - cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
  - cmake --build build --parallel "$(nproc)"
  - bash deps/setup.sh --rebuild-lua
  - bash deps/test.sh

- name: bench
  image: lua-ci:latest
  pull: if-not-exists
  environment:
    CARGO_HOME: /drone/src/.cargo
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1
  commands:
  # 性能基准: C vs Rust (build/lua 已由 deps-tests 构建; PGO 构建恢复默认
  # features — deps/setup.sh 在 target/release/lua 留下了 threaded,skynet 变体,
  # 不能用于基准)。PGO 三步: instrumented 构建 → tests_lua+bench 通用负载训练 →
  # profile-use 重建; 工具链缺失或任一步失败自动回退普通 cargo build (PGO_FALLBACK)。
  # target-cpu=native 安全性: bench 二进制只在构建它的同一 runner 主机上运行;
  # 其他步骤的 plain build 由 cargo 指纹 (RUSTFLAGS 变更) 强制独立重建, 不会
  # 复用 native 产物。
  - lscpu | grep -m1 "Model name" || true
  - PGO_RUSTFLAGS="-Ctarget-cpu=native" bash tools/build_pgo.sh
  - ./target/release/lua -v
  - bash tools/ci_bench.sh --skip-build full

- name: save-cache
  image: drillster/drone-volume-cache
  volumes:
  - name: cache
    path: /cache
  settings:
    rebuild: true
    mount:
      - .cargo
      - target
      - deps/cache
      - deps/src

volumes:
- name: cache
  host:
    path: /tmp/drone-cache

---
# Windows Rust Build
# Requires cargo on the runner service PATH (exec runner runs PowerShell).
kind: pipeline
type: exec
name: rust-windows

platform:
  os: windows
  arch: amd64

steps:
- name: build
  commands:
  - cargo build --release
  - cargo test --release
  - .\target\release\lua.exe -v

- name: bench
  commands:
  - powershell -ExecutionPolicy Bypass -File tools/ci_bench_win.ps1 -Scale full
