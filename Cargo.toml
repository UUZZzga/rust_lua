[package]
name = "lua-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "lua_rs"
path = "src_rs/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "lua"
path = "src_rs/main.rs"

[[test]]
name = "integration_tests"
path = "tests_rs/integration_tests.rs"

[[test]]
name = "upvalue_tests"
path = "tests_rs/upvalue_tests.rs"

[[test]]
name = "metamethod_tests"
path = "tests_rs/metamethod_tests.rs"

[[test]]
name = "arithmetic_tests"
path = "tests_rs/arithmetic_tests.rs"

[[test]]
name = "string_tests"
path = "tests_rs/string_tests.rs"

[[test]]
name = "base_lib_tests"
path = "tests_rs/base_lib_tests.rs"

[[test]]
name = "math_lib_tests"
path = "tests_rs/math_lib_tests.rs"

[[test]]
name = "alloc_failure_tests"
path = "tests_rs/alloc_failure_tests.rs"

[features]
# 【临时诊断】大额分配跟踪（定位内存耗尽时仍 abort 的分配点，用完即删）
default = ["fast_unsafe"]
# ---- 数值类型配置 (对应 luaconf.h 的 LUA_INT_TYPE / LUA_FLOAT_TYPE) ----
# 默认 (不启用下列 feature) = C 的默认配置: 64 位整数 (long long) + double。
# 启用后 LuaInteger/LuaNumber/LuaUnsigned 及其派生常量 (MAX_INTEGER / INTEGER_FMT /
# NUMBER_FMT ...) 全部切换，C API 的 lua_Integer/lua_Number (capi.rs) 随之改变。
# 注意 (与 C 的 luaconf.h 一致): 任何与 Lua 连接的外部 C 代码必须使用同一配置。
# 用法:
#   cargo build --release --features embedded     # ≈ C 的 LUA_32BITS (i32 + f32)
#   cargo build --release --features num-i32      # 仅 32 位整数 (对应 LUA_INT_INT)
#   cargo build --release --features num-f32      # 仅 32 位浮点 (对应 LUA_FLOAT_FLOAT)
# 不支持的组合: long double (Rust stable 无 f80/f128)。
# LuaInteger = i32 (对应 LUA_INT_TYPE = LUA_INT_INT)
num-i32 = []
# LuaNumber = f32 (对应 LUA_FLOAT_TYPE = LUA_FLOAT_FLOAT)
num-f32 = []
# 嵌入式32位配置: 32 位整数 + 32 位浮点 (对应 C 的 LUA_32BITS)
embedded = ["num-i32", "num-f32"]
# VM 热路径 unsafe 优化开关 (默认启用)。
# 启用时: 指令/常量流用裸指针缓存 (免每指令 Rc→Vec 双 deref + 边界检查),
#   栈读写用 as_mut_ptr/get_unchecked 跳过边界检查, 并跳过 trivially-droppable
#   旧值的 drop_glue; upvalue/表读路径用 as_ptr/RefCell::as_ptr 绕过 borrow 计数。
# 关闭时 (--no-default-features): 全部改为安全等价实现 (Rc 句柄 + 边界检查 +
#   常规 drop + borrow 守卫), 语义不变, 用于量化这些优化带来的性能差距。
# 不属于本开关的范围: FFI/C ABI (capi/io/os)、自定义分配器 (alloc/mem)、
#   GC 裸指针 (gc.rs)、TString 指针表示 (strings.rs)、枚举 transmute (opcodes)。
# 用法: cargo build --release --no-default-features
fast_unsafe = []
# 链接 C 实现的 liblua 作为参考基准, 用于编译器比对测试 (compiler::cmp_tests)。
# 启用时: bindings.rs / parser.rs / lua_ffi.rs 模块生效, capi.rs 模块禁用以避免符号冲突。
# 用法: cargo test --features cmp_c -- compiler::cmp_tests::compiler_compare_tests
cmp_c = []
# 默认关闭: StringTable/StringCache 使用 std::cell::RefCell (零开销,单线程)
# 启用时改用 parking_lot::RwLock (多线程安全,有原子操作开销)
threaded = ["parking_lot"]
# skynet 扩展 API: 实现 skynet 修改版 Lua 5.5.1 的扩展 (luaL_alloc/lua_clonetable/
# lua_sharefunction/lua_sharestring/luaL_loadfilex_), 让 lua-rs 能作为 skynet 的 Lua 后端.
# 启用后这些符号从 liblua_rs.a 导出, 供 dlopen 加载的 luaclib/skynet.so 解析.
# 当前 luaL_alloc 为真实实现 (realloc 包装), 其余为 stub (调用时报错).
# 真正的 sharetable 共享机制 (跨 LuaState 共享 Table/Proto/String) 未实现.
skynet = []
# 强制使用 setjmp/longjmp 实现 C 函数错误处理 (对应 C 的 LUA_USE_LONGJMP 宏)。
# 默认 (非启用): 用 catch_unwind 捕获 panic (lua_error → panic), 类似 C++ 异常机制。
# 启用 lua_longjmp: 用 setjmp/longjmp 替代 catch_unwind。
#   - panic=abort 模式下 catch_unwind 不工作, 必须启用 (size_optimized 自动启用)
#   - 也可独立启用: cargo build --features lua_longjmp
# 注意: size_optimized 模式 (OPT_LEVEL=s/z) 自动启用此 feature, 无需手动指定。
lua_longjmp = []
# nightly-allocator: 在 nightly 工具链上让 allocator-aware 容器使用标准库实现。
# 标准库的 `Box<T, A>` / `Vec<T, A>`（自定义分配器）受 unstable allocator_api
# 特性门控, stable 不可用。启用本 feature 后 (src_rs/mem.rs):
#   - crate 根经 cfg_attr 启用 #![feature(allocator_api)];
#   - AllocBox/AllocVec 直接指向标准库 std::boxed::Box / std::vec::Vec;
#   - SlotAlloc 额外实现 core::alloc::Allocator (与 allocator-api2 的 shim 是两个
#     不同的 trait, hashbrown::HashTable 仍走 shim, 互不影响)。
# 未启用 (stable 默认) 时回退 allocator_api2 兼容实现 (API 完全一致)。
# 注意: Cargo 无法按工具链自动开关, 故 nightly 上需显式指定。
# 用法: cargo build --features nightly-allocator
nightly-allocator = []
# write_stack scratch 不变量诊断 (见 CLAUDE.md「栈 scratch 不变量」):
# 打开后扫描每次寄存器写, 报告越过 max(len, scratch_end) 或超出 capacity 的次数
# (WSOOB / WSCAP)。tests_lua 全套应为零输出。
probe_wstack = []
# 体积优先模式: 通过 [profile.size-opt] 实现 (opt-level="z" + panic="abort"),
# build.rs 检测 OPT_LEVEL=s/z 自动设置 cfg(size_optimized) 切换代码层面优化:
#   - 浮点格式化/解析用 libc snprintf/strtod 替代 Rust flt2dec/dec2flt (~34KB)
#   - f64_to_string 两阶段格式化匹配 C Lua 5.5 (先 %.15g, 不往返再用 %.17g)
#   - main.rs 不使用 std::thread::Builder, 减少线程 panic 处理代码
#   - C 代码用 -fno-exceptions -fno-unwind-tables 禁用异常 unwind 表
#   - 用 ASCII 版本替代 Unicode 函数 (to_ascii_uppercase/lowercase) 移除 Unicode 表 (~14KB)
#   - 所有 #[inline] / #[inline(always)] 改为 #[cfg_attr(not(size_optimized), inline)]
#   - linker 添加 --no-eh-frame-hdr + --icf=all + -z,norelro
# 用法 (推荐): bash tools/build_size_opt.sh
#   自动检测 nightly 工具链:
#     - 有 nightly: panic=immediate-abort + build-std, 移除 backtrace 代码 (~150KB)
#     - 无 nightly: panic=abort (stable 兼容)
#   自动执行 cargo build + objcopy --strip-all + 移除 .eh_frame 等无用段
# 用法 (手动, stable): cargo build --profile size-opt
#   需手动执行: objcopy --strip-all --remove-section=.eh_frame ... target/size-opt/lua
# 最终体积: ~635KB (nightly) / ~968KB (stable) / ~1.87MB (release)

[dependencies]
libc = "0.2"
hashbrown = "0.15"
# allocator-api2: 让 Vec/Box/HashTable 等容器携带 MemState 自定义分配器
# （经 AllocSlot 路由）。hashbrown 0.15 默认已依赖它，此处直接引用其
# Allocator trait 与 Vec/Box 容器，避免重复造轮子。
allocator-api2 = "0.2"
bitflags = "2"
parking_lot = { version = "0.12", optional = true }
const_format = "0.2"

[dev-dependencies]
imara-diff = "0.2"
cargo-husky = { version = "1", features = ["precommit-hook", "run-cargo-fmt"] }

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
strip = "debuginfo"
panic = "unwind"
overflow-checks = false

# 性能分析专用 profile: 保留优化但带调试符号,不 strip,用于 perf 分析
[profile.perf]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# 体积优先 profile (对应 GCC -Oz): 在 release 基础上切换为体积优化。
# 用法: bash tools/build_size_opt.sh (推荐, 自动 strip)
#    或 cargo build --profile size-opt (手动, 需自行 strip .eh_frame)
#   - opt-level = "z": 优化体积 (对应 GCC -Oz, 比 -Os 更激进), 禁用会增大代码体积的优化
#   - panic = "abort": 移除 panic unwind 表, 减小二进制体积
#     (代价: panic 时不 unwind 栈, 直接终止; 对体积优先场景可接受)
#   - lto/codegen-units/strip 继承 release (fat LTO + 单 codegen unit + strip symbols)
[profile.size-opt]
inherits = "release"
opt-level = "z"
panic = "abort"

# 临时分析 profile: 保留符号用于分析大函数
[profile.size-opt-analysis]
inherits = "size-opt"
strip = "none"

# Nightly 专用 profile (panic=immediate-abort) 由 build_size_opt.sh 动态注入,
# 避免 cargo-features = ["panic-immediate-abort"] 破坏 stable 兼容性。
